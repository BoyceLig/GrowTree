name: Build Docker Image

# 触发条件：
#   1. 推送「日期版本号」tag（如 20261010、20261010-2）→ 构建并发布镜像到 GHCR
#   2. 在 Actions 页面手动点 Run workflow → 同样触发（选分支即可）
# 版本号规则：发布日期 YYYYMMDD，同日第 2 版起加 -2、-3……（仓库根目录 VERSION 是唯一真源）
on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN 由 GitHub 自动注入，无需手动配置密钥
      - name: 登录 GHCR（GitHub 容器仓库）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像 tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # tag 名就是版本号：20261010-2 → 镜像 tag 20261010-2
            type=ref,event=tag
            # 每次构建都更新 latest
            type=raw,value=latest

      - name: 构建并推送（amd64 + arm64 双架构）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
